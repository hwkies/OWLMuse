services:

  ##################################################################
  # configure the sql-server container
  sql-server:
    container_name: ${MSSQL_SERVER}
    build: ./db
    image: mcr.microsoft.com/mssql/server:2022-latest
    ports:
      - "1433:1433"
    environment:
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Developer"
    env_file:
      - .env
    volumes:
      - mssql_data:/var/opt/mssql
      - ./data:/data/:ro
    restart: unless-stopped
    networks:
      - owl_model_network
  
  ##################################################################
  # configure the api container
  api:
    # Set up the api according to the Dockerfile inside the server/ folder
    build: ./server
    container_name: server
    # have the container restart if it fails for some reason. 
    restart: unless-stopped  
    env_file:
      - .env
    depends_on:
      - sql-server
    # map host port 8000 to container port 80
    ports:
      - "8000:8000"
    networks:
      - owl_model_network

  devapp:
    build: ./client
    container_name: client_dev
    restart: unless-stopped
    environment:
      - ENV=development
    env_file:
      - .env
    ports:
      - "4200:4200"
    networks:
      - owl_model_network
    profiles: ["dev"]

  prodapp:
    build: ./client
    container_name: client_prod
    restart: unless-stopped
    environment:
      - ENV=production
    env_file:
      - .env
    ports:
      - "4200:4200"
    networks:
      - owl_model_network
    profiles: ["prod"]


networks:
  owl_model_network:

volumes:
  mssql_data: