services:

  ##################################################################
  # configure the server container
  server:
    # Set up the api according to the Dockerfile inside the server/ folder
    build: ./server
    container_name: server
    # have the container restart if it fails for some reason. 
    restart: on-failure:3
    env_file:
      - .env
    # map host port 8000 to container port 80
    ports:
      - "8000:8000"
    networks:
      - owlmuse_network

  client:
    build: ./client
    container_name: client
    restart: on-failure:3
    ports:
      - "3000:3000"
    networks:
      - owlmuse_network
